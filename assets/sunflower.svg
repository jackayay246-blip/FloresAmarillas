<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Girasol amarillo ilustrado">
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a8"/>
      <stop offset=".46" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#f2a51a"/>
    </linearGradient>
    <radialGradient id="core" cx="36%" cy="30%">
      <stop offset="0" stop-color="#7d4b1b"/>
